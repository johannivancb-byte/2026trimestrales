    <title>Consulta Salones - Sede San Nicolás</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --azul-rey: #0047AB; }

        .bg-azul-rey { background-color: var(--azul-rey); }
        .text-azul-rey { color: var(--azul-rey); }
        .border-azul-rey { border-color: var(--azul-rey); }
        .card-anim { transition: all 0.3s ease; }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-white shadow-md p-6 flex flex-col items-center border-b-4 border-azul-rey">
        <img src="https://drive.google.com/uc?export=view&id=REEMPLAZA_ESTE_ID" alt="Logo Colegio" class="h-24 mb-3">
        <h1 class="text-2xl font-black text-azul-rey text-center uppercase tracking-wider">Sede San Nicolás</h1>
        <div class="bg-azul-rey text-white px-4 py-1 rounded-full text-xs font-bold mt-2">EVALUACIONES TRIMESTRALES 2026</div>
    </header>

    <main class="max-w-md mx-auto mt-6 px-4">
        
        <div id="perfil-selector" class="flex gap-4 mb-6">
            <button onclick="setPerfil('estudiante')" id="btn-est" class="flex-1 py-4 rounded-xl font-bold border-2 border-azul-rey bg-azul-rey text-white shadow-lg card-anim">ESTUDIANTE</button>
            <button onclick="setPerfil('docente')" id="btn-doc" class="flex-1 py-4 rounded-xl font-bold border-2 border-azul-rey text-azul-rey bg-white shadow-lg card-anim">DOCENTE</button>
        </div>

        <!-- SECCION ESTUDIANTE -->
        <div id="seccion-estudiante" class="space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-xl border-t-4 border-azul-rey">
                <label class="block text-gray-700 font-bold mb-3">Busca tu nombre o código:</label>
                <input type="text" id="input-busqueda" oninput="buscarEstudiante()" placeholder="Escribe aquí..." class="w-full p-4 border-2 rounded-xl focus:border-azul-rey outline-none text-lg">
                <p class="text-xs text-gray-400 mt-2 italic text-center">No es necesario escribir todo el nombre.</p>
            </div>
            <div id="resultado-busqueda" class="space-y-4"></div>
        </div>

        <!-- SECCION DOCENTE -->
        <div id="seccion-docente" class="hidden space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-xl border-t-4 border-azul-rey">
                <label class="block text-gray-700 font-bold mb-3">Selecciona el Salón a cargo:</label>
                <select id="select-salon" onchange="filtrarPorSalon()" class="w-full p-4 border-2 rounded-xl focus:border-azul-rey text-lg bg-gray-50">
                    <option value="">-- Elige un salón --</option>
                </select>
            </div>
            
            <div id="area-docente-resultados" class="hidden space-y-4">
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                    <div class="bg-azul-rey p-3 text-white font-bold text-center uppercase tracking-widest text-sm">Lista de Asistencia</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-100 text-azul-rey text-xs uppercase">
                                <tr>
                                    <th class="p-3">Nombre</th>
                                    <th class="p-3 text-center">Curso</th>
                                </tr>
                            </thead>
                            <tbody id="body-tabla" class="divide-y text-sm"></tbody>
                        </table>
                    </div>
                </div>

                <div id="consolidado-grado" class="bg-white p-6 rounded-2xl shadow-xl border-2 border-blue-100">
                    <h3 class="font-black text-azul-rey mb-4 uppercase text-center border-b pb-2">Material de Examen</h3>
                    <div id="lista-consolidado" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </main>

            document.getElementById('seccion-docente').classList.toggle('hidden', isEst);
            document.getElementById('btn-est').className = isEst ? "flex-1 py-4 rounded-xl font-bold border-2 border-azul-rey bg-azul-rey text-white shadow-lg" : "flex-1 py-4 rounded-xl font-bold border-2 border-azul-rey text-azul-rey bg-white shadow-lg";
            document.getElementById('btn-doc').className = !isEst ? "flex-1 py-4 rounded-xl font-bold border-2 border-azul-rey bg-azul-rey text-white shadow-lg" : "flex-1 py-4 rounded-xl font-bold border-2 border-azul-rey text-azul-rey bg-white shadow-lg";
        }

        function buscarEstudiante() {
            const term = document.getElementById('input-busqueda').value.toLowerCase();
            const resDiv = document.getElementById('resultado-busqueda');
            resDiv.innerHTML = '';
            
            if(term.length < 3) return;

            const filtrados = estudiantes.filter(e => e.n.toLowerCase().includes(term) || e.d.includes(term));
            
            filtrados.slice(0, 5).forEach(e => {
                resDiv.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl shadow-lg border-l-8 border-azul-rey animate-fade-in">
                        <p class="text-xs text-gray-500 font-bold uppercase tracking-widest">${e.c}</p>
                        <h2 class="text-lg font-black text-gray-800 leading-tight mb-2">${e.n}</h2>
                        <div class="flex items-center justify-between mt-4">
                            <span class="text-sm font-bold text-gray-400 uppercase">Salón Asignado:</span>
                            <span class="bg-azul-rey text-white text-3xl font-black px-6 py-2 rounded-xl shadow-inner">${e.s}</span>
                        </div>
                    </div>
                `;
            });
        }

        function filtrarPorSalon() {
            const s = document.getElementById('select-salon').value;
            const area = document.getElementById('area-docente-resultados');
            const body = document.getElementById('body-tabla');
            const cons = document.getElementById('lista-consolidado');
            
            if(!s) { area.classList.add('hidden'); return; }
            area.classList.remove('hidden');
            body.innerHTML = '';
            
            const filtrados = estudiantes.filter(e => e.s == s);
            
            // Tabla
            filtrados.forEach(e => {
                body.innerHTML += `<tr><td class="p-3 font-medium uppercase text-xs">${e.n}</td><td class="p-3 text-center font-bold text-azul-rey">${e.c}</td></tr>`;
            });

            // Consolidado
            const counts = {};
            filtrados.forEach(e => {
                const grado = e.c.substring(0, e.c.length === 3 ? 1 : 2);
                const nivel = grado == "6" ? "SEXTO" : grado == "7" ? "SÉPTIMO" : grado == "8" ? "OCTAVO" : grado == "9" ? "NOVENO" : grado == "10" ? "DÉCIMO" : "ONCE";
                counts[nivel] = (counts[nivel] || 0) + 1;
            });

            cons.innerHTML = '';
            Object.entries(counts).forEach(([g, c]) => {
                cons.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
                        <span class="font-bold text-gray-600">${g}</span>
                        <span class="bg-white border-2 border-azul-rey text-azul-rey font-black px-3 py-1 rounded-lg">${c} pruebas</span>
                    </div>
                `;
            });
            cons.innerHTML += `<div class="mt-4 pt-2 border-t flex justify-between font-black text-lg"><span>TOTAL:</span><span>${filtrados.length} pruebas</span></div>`;
        }
    </script>
</body>
</html>
